<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Gerador de Escala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@1,400;1,600&family=Manrope:wght@500;600;700;800&family=Oswald:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: mesa de trabalho escura — prévia grande à esquerda, painel compacto com abas à direita */
:root{
  --bg:#0a0e1a; --panel:#111728; --field:#0c1222; --line:#232c45; --fg:#e9ecf5; --muted:#8a93ad;
  --accent:#ff8a3d; --accent-ink:#1a0d03; --danger:#ff6b6b;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:800;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:#3a4566}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800;padding:9px 18px}
.btn-main:hover{filter:brightness(1.08);border-color:var(--accent)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.stage{min-height:0;min-width:0;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at 50% 40%,#141b30,transparent 70%)}
.stage canvas{display:block;border-radius:6px;
  box-shadow:0 20px 60px rgba(0,0,0,.55)}
.panel{min-height:0;display:grid;grid-template-rows:auto 1fr;border-left:1px solid var(--line);background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:13px 6px;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec-t{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}

/* escala */
.blk{display:flex;flex-direction:column;gap:6px}
.blk-h{display:flex;align-items:center;gap:8px;font-weight:700;padding-bottom:4px}
.blk-h span.h{color:var(--muted);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.erow{display:grid;grid-template-columns:44px 1fr 1fr 1fr 58px;gap:5px;align-items:center}
.erow .dt{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.erow select{padding:7px 4px 7px 7px;font-size:13px}
.erow select:first-of-type{font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pitem{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;background:var(--field);min-width:0}
.pitem span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .del{padding:5px 8px;font-size:12px}
.erow.is-todas input{opacity:.3}
.chip{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* cultos */
.ccard{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--field)}
.ccard .row{display:flex;gap:10px;align-items:flex-end}
.ccard input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.del{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
.del.armed{border-color:var(--danger);color:var(--danger)}

/* visual */
.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cvwrap{position:relative;line-height:0}
.cvwrap.whats::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.model{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.model[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.model b{font-size:13px}
.model small{color:var(--muted);font-size:11px;line-height:1.3}
.mini{height:54px;border-radius:7px;background:#1b2440;position:relative;overflow:hidden}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--field);border:0;padding:8px 4px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.sl{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.colorrow{display:flex;align-items:center;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.colorrow input{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2440;border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);z-index:20}
.toast.err{border-color:var(--danger);color:#ffd2d2}

@media (max-width:860px){
  .app{height:auto;display:block}
  .work{display:block}
  .stage{height:58vh;padding:12px}
  .panel{border-left:0;border-top:1px solid var(--line);display:block}
  .pane{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand span{display:none}
}
@media (max-width:400px){
  .erow{grid-template-columns:38px 1fr 1fr 1fr 50px;gap:4px}
  .models{grid-template-columns:1fr 1fr}
}
</style>

</head><body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Gerador de Escala</b><span id="topinfo"></span></div>
    <button class="btn btn-main" id="baixar" type="button">Baixar PNG</button>
  </header>
  <main class="work">
    <section class="stage" aria-label="Prévia da imagem"><div class="cvwrap" id="cvwrap"><canvas id="cv" width="2160" height="2700"></canvas></div></section>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-escala" data-tab="escala" aria-selected="true">Escala</button>
        <button role="tab" id="tab-cultos" data-tab="cultos" aria-selected="false">Cultos</button>
        <button role="tab" id="tab-equipe" data-tab="equipe" aria-selected="false">Equipe</button>
        <button role="tab" id="tab-visual" data-tab="visual" aria-selected="false">Visual</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
</div>
<datalist id="nomes"></datalist>
<input type="file" id="f-foto" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script>

window.addEventListener('error',e=>toast('Erro: '+(e.message||'falha inesperada'),true));

/* Versículos de adoração — João Ferreira de Almeida (mesmo texto do bible-api.com usado no Ler Bíblia). *palavra* = destaque */
const VERSOS=[{"g": "Dança", "r": "Salmos 149:3", "t": "Louvem-lhe o nome com *danças*, cantem-lhe louvores com adufe e harpa."}, {"g": "Dança", "r": "Salmos 150:4", "t": "Louvai-o com adufe e com *danças*; louvai-o com instrumentos de cordas e com flauta!"}, {"g": "Dança", "r": "Êxodo 15:20", "t": "Então Miriã, a profetisa, irmã de Arão, tomou na mão um tamboril, e todas as mulheres saíram atrás dela com tamboris, e com *danças*."}, {"g": "Dança", "r": "2 Samuel 6:14", "t": "E Davi *dançava* com todas as suas forças diante do Senhor; e estava Davi cingido dum éfode de linho."}, {"g": "Dança", "r": "Jeremias 31:13", "t": "Então a virgem se alegrará na *dança*, como também os mancebos e os velhos juntamente; porque tornarei o seu pranto em gozo, e os consolarei, e lhes darei alegria em lugar de tristeza."}, {"g": "Louvor e adoração", "r": "Salmos 150:6", "t": "Tudo quanto tem fôlego *louve* ao Senhor. Louvai ao Senhor!"}, {"g": "Louvor e adoração", "r": "Salmos 149:1", "t": "Louvai ao Senhor! Cantai ao Senhor um *cântico novo*, e o seu louvor na assembléia dos santos!"}, {"g": "Louvor e adoração", "r": "Salmos 95:1", "t": "Vinde, cantemos *alegremente* ao Senhor, cantemos com júbilo à rocha da nossa salvação."}, {"g": "Louvor e adoração", "r": "Salmos 95:6", "t": "Oh, vinde, *adoremos* e prostremo-nos; ajoelhemos diante do Senhor, que nos criou."}, {"g": "Louvor e adoração", "r": "Salmos 96:9", "t": "*Adorai* ao Senhor vestidos de trajes santos; tremei diante dele, todos os habitantes da terra."}, {"g": "Louvor e adoração", "r": "Salmos 100:1-2", "t": "Celebrai com júbilo ao Senhor, todos os habitantes da terra. Servi ao Senhor com *alegria*, e apresentai-vos a ele com cântico."}, {"g": "Louvor e adoração", "r": "Salmos 100:4", "t": "Entrai pelas suas portas com ação de graças, e em seus átrios com *louvor*; dai-lhe graças e bendizei o seu nome."}, {"g": "Louvor e adoração", "r": "Salmos 103:1", "t": "*Bendize*, ó minha alma, ao Senhor, e tudo o que há em mim bendiga o seu santo nome."}, {"g": "Louvor e adoração", "r": "Salmos 34:1", "t": "Bendirei ao Senhor em todo o tempo; o seu *louvor* estará continuamente na minha boca."}, {"g": "Louvor e adoração", "r": "Salmos 34:3", "t": "Engrandeci ao Senhor comigo, e juntos *exaltemos* o seu nome."}, {"g": "Louvor e adoração", "r": "Salmos 63:4", "t": "Assim eu te bendirei enquanto viver; em teu nome levantarei as minhas *mãos*."}, {"g": "Louvor e adoração", "r": "Salmos 134:2", "t": "Erguei as *mãos* para o santuário, e bendizei ao Senhor."}, {"g": "Louvor e adoração", "r": "Salmos 141:2", "t": "Suba a minha oração, como incenso, diante de ti, e seja o levantar das minhas *mãos* como o sacrifício da tarde!"}, {"g": "Louvor e adoração", "r": "Salmos 145:3", "t": "*Grande* é o Senhor, e mui digno de ser louvado; e a sua grandeza é insondável."}, {"g": "Louvor e adoração", "r": "Salmos 146:2", "t": "*Louvarei* ao Senhor durante a minha vida; cantarei louvores ao meu Deus enquanto viver."}, {"g": "Louvor e adoração", "r": "Salmos 147:1", "t": "Louvai ao Senhor; porque é bom cantar *louvores* ao nosso Deus; pois isso é agradável, e decoroso é o louvor."}, {"g": "Louvor e adoração", "r": "Salmos 33:3", "t": "Cantai-lhe um *cântico novo*; tocai bem e com júbilo."}, {"g": "Louvor e adoração", "r": "Salmos 40:3", "t": "Pôs na minha boca um *cântico novo*, um hino ao nosso Deus; muitos verão isso e temerão, e confiarão no Senhor."}, {"g": "Louvor e adoração", "r": "Salmos 47:1", "t": "Batei palmas, todos os povos; aclamai a Deus com voz de *júbilo*."}, {"g": "Louvor e adoração", "r": "Salmos 66:4", "t": "Toda a terra te *adorará* e te cantará louvores; eles cantarão o teu nome."}, {"g": "Louvor e adoração", "r": "Salmos 29:2", "t": "Tributai ao Senhor a glória devida ao seu nome; *adorai* o Senhor vestidos de trajes santos."}, {"g": "Louvor e adoração", "r": "Salmos 113:3", "t": "Desde o nascimento do sol até o seu ocaso, há de ser *louvado* o nome do Senhor."}, {"g": "Louvor e adoração", "r": "1 Crônicas 16:29", "t": "Tributai ao Senhor a glória devida ao seu nome; trazei presentes, e vinde perante ele; *adorai* ao Senhor vestidos de trajes santos."}, {"g": "Louvor e adoração", "r": "João 4:23", "t": "Mas a hora vem, e agora é, em que os verdadeiros *adoradores* adorarão o Pai em espírito e em verdade; porque o Pai procura a tais que assim o adorem."}, {"g": "Louvor e adoração", "r": "João 4:24", "t": "Deus é Espírito, e é necessário que os que o adoram o adorem em *espírito e em verdade*."}, {"g": "Louvor e adoração", "r": "Romanos 12:1", "t": "Rogo-vos pois, irmãos, pela compaixão de Deus, que apresenteis os vossos corpos como um *sacrifício vivo*, santo e agradável a Deus, que é o vosso culto racional."}, {"g": "Louvor e adoração", "r": "Hebreus 13:15", "t": "Por ele, pois, ofereçamos sempre a Deus sacrifício de *louvor*, isto é, o fruto dos lábios que confessam o seu nome."}, {"g": "Louvor e adoração", "r": "Colossenses 3:16", "t": "A palavra de Cristo habite em vós ricamente, em toda a sabedoria; ensinai-vos e admoestai-vos uns aos outros, com salmos, hinos e cânticos espirituais, *louvando* a Deus com gratidão em vossos corações."}, {"g": "Louvor e adoração", "r": "Apocalipse 4:11", "t": "*Digno* és, Senhor nosso e Deus nosso, de receber a glória e a honra e o poder; porque tu criaste todas as coisas, e por tua vontade existiram e foram criadas."}, {"g": "Louvor e adoração", "r": "Sofonias 3:17", "t": "O Senhor teu Deus está no meio de ti, poderoso para te salvar; ele se deleitará em ti com alegria; renovar-te-á no seu amor, regozijar-se-á em ti com *júbilo*."}, {"g": "Louvor e adoração", "r": "Filipenses 4:4", "t": "*Regozijai-vos* sempre no Senhor; outra vez digo, regozijai-vos."}];

function getCell(cid,d){const m=S.dados[mk()];const c=m&&m[cid];return (c&&c[d])||{n:['','',''],todas:false}}

function datasDo(dia){const out=[];const d=new Date(S.ano,S.mes,1);while(d.getMonth()===S.mes){if(d.getDay()===+dia)out.push(d.getDate());d.setDate(d.getDate()+1)}return out}

function blocos(){return S.cultos.map(c=>({c,rows:datasDo(c.dia).map(d=>{const e=getCell(c.id,d);

function kickerTxt(){return (S.kicker||'').trim()||(MESES[S.mes].toUpperCase()+' · '+S.ano)}

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}

function mix(h,t,k){const a=hexRgb(h),b=hexRgb(t);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function seeded(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function setLS(ctx,v){if('letterSpacing' in ctx)ctx.letterSpacing=v+'px'}
function fitSize(ctx,text,weight,fam,size,maxW,min=8){let s=size;ctx.font=`${weight} ${s}px ${fam}`;while(ctx.measureText(text).width>maxW&&s>min){s-=1;ctx.font=`${weight} ${s}px ${fam}`}return s}
function cover(ctx,x,y,w,h,fr,img){if(!fotoOk)return;const foto0=foto,foto1=img||foto0;return coverImg(ctx,x,y,w,h,fr,foto1)}
function coverImg(ctx,x,y,w,h,fr,foto){const z=(fr.z||100)/100;const sc=Math.max(w/foto.width,h/foto.height)*z;
  const dw=foto.width*sc,dh=foto.height*sc;const ox=x+(w-dw)*(fr.x/100),oy=y+(h-dh)*(fr.y/100);
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(foto,ox,oy,dw,dh);ctx.restore()}
function snapshot(cv){const s=document.createElement('canvas');s.width=cv.width;s.height=cv.height;s.getContext('2d').drawImage(cv,0,0);return s}
function glass(ctx,snap,W,H,x,y,w,h,r,tint,stroke,blur=16){ctx.save();rr(ctx,x,y,w,h,r);ctx.clip();
  if('filter' in ctx){ctx.filter=`blur(${blur}px)`;ctx.drawImage(snap,-30,-30,W+60,H+60);ctx.filter='none'}
  ctx.fillStyle=tint;ctx.fillRect(x,y,w,h);ctx.restore();
  if(stroke){rr(ctx,x+.5,y+.5,w-1,h-1,r);ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke()}}

function drawIcon(ctx,kind,cx,cy,s,color,inner){ctx.save();ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineCap='round';
  if(kind==='sol'){const r=s*.19;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.lineWidth=s*.08;
    for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*1.6,cy+Math.sin(a)*r*1.6);ctx.lineTo(cx+Math.cos(a)*r*2.4,cy+Math.sin(a)*r*2.4);ctx.stroke()}}
  else if(kind==='lua'){const r=s*.38;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();ctx.beginPath();ctx.rect(cx-r,cy-r,2*r,2*r);ctx.arc(cx+r*.42,cy-r*.3,r*.8,0,7,true);ctx.fill('evenodd')}
  else if(kind==='fogo'){const k=s*.46;const flame=(sc,dy)=>{ctx.beginPath();ctx.moveTo(cx,cy-k*sc+dy);
      ctx.bezierCurveTo(cx+k*.25*sc,cy-k*.55*sc+dy,cx+k*.82*sc,cy-k*.15*sc+dy,cx+k*.7*sc,cy+k*.42*sc+dy);
      ctx.bezierCurveTo(cx+k*.6*sc,cy+k*.85*sc+dy,cx+k*.25*sc,cy+k*sc+dy,cx,cy+k*sc+dy);
      ctx.bezierCurveTo(cx-k*.25*sc,cy+k*sc+dy,cx-k*.6*sc,cy+k*.85*sc+dy,cx-k*.7*sc,cy+k*.42*sc+dy);
      ctx.bezierCurveTo(cx-k*.8*sc,cy-k*.05*sc+dy,cx-k*.3*sc,cy-k*.3*sc+dy,cx,cy-k*sc+dy);ctx.fill()};
    flame(1,0);if(inner){ctx.fillStyle=inner;flame(.48,k*.45)}}

  else if(kind==='coracao'){const k=s*.42;ctx.beginPath();ctx.moveTo(cx,cy+k*.85);
    ctx.bezierCurveTo(cx-k*1.25,cy+k*.05,cx-k*.75,cy-k*.95,cx,cy-k*.38);ctx.bezierCurveTo(cx+k*.75,cy-k*.95,cx+k*1.25,cy+k*.05,cx,cy+k*.85);ctx.fill()}
  ctx.restore()}

/* texto rico do versículo: *palavra* = destaque */
function richWords(text,up){const out=[];let hl=false;
  for(const raw of String(text).split(/\s+/)){if(!raw)continue;const ps=[];let buf='';
    for(const ch of raw){if(ch==='*'){if(buf)ps.push({t:up&&!hl?buf.toUpperCase():buf,k:hl?'h':'n'});buf='';hl=!hl}else buf+=ch}
    if(buf)ps.push({t:up&&!hl?buf.toUpperCase():buf,k:hl?'h':'n'});if(ps.length)out.push(ps)}
  if(out.length){out[0].unshift({t:'“',k:'q'});out[out.length-1].push({t:'”',k:'q'})}return out}
function wrapRich(ctx,words,maxW,f){const lines=[];let cur=[],cw=0;ctx.font=f.n;const sp=ctx.measureText(' ').width;
  for(const w of words){let ww=0;for(const p of w){ctx.font=f[p.k];p.w=ctx.measureText(p.t).width;ww+=p.w}
    if(cur.length&&cw+sp+ww>maxW){lines.push({ws:cur,w:cw});cur=[];cw=0}
    cw+=(cur.length?sp:0)+ww;cur.push({ps:w,w:ww})}
  if(cur.length)lines.push({ws:cur,w:cw});lines.sp=sp;return lines}
function verseFit(ctx,mkFonts,text,maxW,size,maxLines,up){let s=size;for(;;){const f=mkFonts(s);const L=wrapRich(ctx,richWords(text,up),maxW,f);
  if(L.length<=maxLines||s<=14)return{L,s,f};s-=1}}
function drawRich(ctx,L,f,col,x,y,lh,align){L.forEach((ln,i)=>{let cx=align==='center'?x-ln.w/2:x;const yy=y+i*lh;
  ln.ws.forEach(w=>{w.ps.forEach(p=>{ctx.font=f[p.k];ctx.fillStyle=col[p.k];
    if(p.k==='h'&&f.rot){ctx.save();ctx.translate(cx,yy);ctx.rotate(f.rot);ctx.fillText(p.t,0,0);ctx.restore()}else ctx.fillText(p.t,cx,yy);cx+=p.w});cx+=L.sp})})}

function speckled(text,fam,size,color,seed){const m=document.createElement('canvas').getContext('2d');m.font=`400 ${size}px ${fam}`;
  const w=Math.ceil(m.measureText(text).width)+4,h=Math.ceil(size*1.0);const c=document.createElement('canvas');c.width=w*2;c.height=h*2;
  const x=c.getContext('2d');x.scale(2,2);x.font=`400 ${size}px ${fam}`;x.fillStyle=color;x.textBaseline='alphabetic';x.fillText(text,2,size*.86);
  x.globalCompositeOperation='destination-out';const r=seeded(seed);const n=Math.round(w*h/55);
  for(let i=0;i<n;i++){const rad=Math.pow(r(),3)*size*.011+size*.002;x.beginPath();x.ellipse(r()*w,r()*h,rad,rad*(.5+r()*.8),r()*3,0,7);x.fill()}
  for(let i=0;i<Math.round(w/14);i++){x.globalAlpha=.5+r()*.5;x.beginPath();x.ellipse(r()*w,r()*h,size*(.006+r()*.016),size*(.002+r()*.006),r()*3,0,7);x.fill()}
  return{c,w,h,base:size*.86}}

/* ---------- modelo 1: PALCO (faixas coloridas, foto ao lado) ---------- */
function drawPalco(ctx,W,H){const ink='#070b1a',pad=W*.055,ac=S.destaque;

  while(ctx.measureText(t1).width>W*.56&&ts>40){ts-=2;ctx.font=`400 ${ts}px ${F.bebas}`}
  const sp=speckled(t1,F.bebas,ts,'#f3efe8',11);const ty=pad*.55;ctx.drawImage(sp.c,pad-2,ty,sp.w,sp.h);
  const base=ty+sp.base;let tb=ty+sp.h;

    let x2=pad+sp.w+ts*.06,y2=base-ts*.04;if(x2+w2>W-pad){x2=pad+ts*.03;y2=tb+t2s*.95;tb=y2+t2s*.2}
    ctx.save();ctx.translate(x2,y2);ctx.rotate(-.07);ctx.fillStyle=ac;ctx.shadowColor=rgba(ac,.5);ctx.shadowBlur=18;ctx.fillText(S.titulo2,0,0);ctx.restore()}

  // versículo
  const vw=W*.64,vs=W*.03;const V=verseFit(ctx,s=>({n:`500 ${s}px ${F.osw}`,h:`400 ${s*1.45}px ${F.marker}`,q:`400 ${s*1.7}px ${F.bebas}`,rot:-.05}),S.versiculo,vw,vs,4,true);
  const lh=V.s*1.32,rs=V.s*.66,vh=V.L.length*lh+rs*1.9;const vy=H-pad*.85-vh+V.s;
  drawRich(ctx,V.L,V.f,{n:'#f3efe8',h:ac,q:ac},pad+4,vy,lh,'left');
  ctx.font=`500 ${rs}px ${F.osw}`;setLS(ctx,rs*.2);ctx.fillStyle=ac;ctx.fillText((S.referencia||'').toUpperCase(),pad+4,vy+(V.L.length-1)*lh+rs*1.9);setLS(ctx,0);
  // escala
  const B=blocos();const bot=vy-V.s-H*.03;const avail=bot-top;

  let rh=Math.min(fmt()==='story'?W*.072:W*.058,Math.max(W*.028,avail/Math.max(units,1)));
  let y=top+Math.max(0,(avail-units*rh)/2);const tw=W*.6;
  B.forEach(b=>{const c=b.c,bh=rh*1.2,cr=bh*.74,icx=pad+cr*.9,icy=y+bh/2;
    const bx=icx;const gb=ctx.createLinearGradient(bx,0,bx+tw+bh,0);gb.addColorStop(0,c.cor);gb.addColorStop(.6,mix(c.cor,'#000000',.2));gb.addColorStop(1,rgba(c.cor,0));
    ctx.fillStyle=gb;ctx.fillRect(bx,y,tw+bh,bh);
    ctx.beginPath();ctx.arc(icx,icy,cr,0,7);ctx.fillStyle=mix(c.cor,'#000000',.12);ctx.fill();ctx.lineWidth=cr*.11;ctx.strokeStyle='#ffffff';ctx.stroke();
    drawIcon(ctx,c.icone,icx,icy,cr*1.15,'#ffffff',mix(c.cor,'#000000',.12));

    ctx.font=`500 ${ls}px ${F.osw}`;ctx.fillStyle='#ffffff';ctx.textBaseline='middle';ctx.fillText(lbl,icx+cr+bh*.32,icy+ls*.04);ctx.textBaseline='alphabetic';

      const vline=x=>{ctx.beginPath();ctx.moveTo(x,y+rh*.1);ctx.lineTo(x,y+rh*.9);ctx.stroke()};vline(rx0+dw-rh*.25);

      ctx.textBaseline='alphabetic';
      if(i<b.rows.length-1){ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(rx0-rh*.1,y+rh-.5,tw-(rx0-pad)+bh*.2,1)}

function blockSize(ctx,b,w1,w2,size,maxW){let s=size;const sep='  ·  ';
  for(const r of b.rows){if(r.todas||!r.names.length)continue;for(;;){ctx.font=`${w1} ${s}px ${F.inter}`;let w=ctx.measureText(r.names[0]).width;ctx.font=`${w2} ${s}px ${F.inter}`;
    r.names.slice(1).forEach(n=>w+=ctx.measureText(sep+n).width);if(w<=maxW||s<=10)break;s-=1}}return s}
/* ---------- modelo 2: CARTÕES (editorial, um cartão por data) ---------- */
function drawCartoes(ctx,W,H,cv){const ink='#060b1d',pad=W*.06,ac=S.destaque;

  const ks=W*.017;const ky=pad+ks;
  let ts=Math.min(W*.155,H*.13);const tl=[S.titulo1||'',S.titulo2||''].filter(Boolean);
  tl.forEach(t=>{ctx.font=`400 ${ts}px ${F.bebas}`;while(ctx.measureText(t).width>W*.82&&ts>40){ts-=2;ctx.font=`400 ${ts}px ${F.bebas}`}});
  const tTop=ky+ks*1.2,tBot=tTop+ts*.86*tl.length+ts*.04;

  // escala (colunas)
  const B=blocos();const ncol=(fmt()==='story'||B.length<2)?1:2;const cg=W*.022;const colW=(W-pad*2-(ncol-1)*cg)/ncol;
  const cols=Array.from({length:ncol},()=>({bs:[],u:0}));

/* ---------- modelo 3: PÔSTER (foto inteira, painéis de vidro) ---------- */

function renderModelo(ctx,W,H,canvas){ctx.textAlign='left';ctx.textBaseline='alphabetic';setLS(ctx,0);ctx.shadowBlur=0;
  const m=S.modelo;if(m==='cartoes')drawCartoes(ctx,W,H,canvas);else if(m==='poster')drawPoster(ctx,W,H,canvas);else if(m==='claro')drawClaro(ctx,W,H);
  else if(m==='dividido')drawDividido(ctx,W,H);else if(m==='duotone')drawDuotone(ctx,W,H);else drawPalco(ctx,W,H)}

const cv=document.getElementById('cv');let raf=0;
function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{
  const whats=S.formato==='whats';const[W,H]=whats?[1080,1080]:(FORMATOS[S.formato]||FORMATOS.feed);const SC=whats?1:2;
  if(cv.width!==W*SC||cv.height!==H*SC){cv.width=W*SC;cv.height=H*SC;fit()}
  document.getElementById('cvwrap').classList.toggle('whats',whats);
  const ctx=cv.getContext('2d');ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);
  if(whats){/* arte inteira dentro da área que o círculo do WhatsApp não corta */
    const off=document.createElement('canvas');off.width=W*2;off.height=H*2;const o=off.getContext('2d');o.setTransform(2,0,0,2,0,0);renderModelo(o,W,H,off);
    ctx.fillStyle='#080c1c';ctx.fillRect(0,0,W,H);
    if(fotoOk){ctx.save();if('filter' in ctx)ctx.filter='blur(26px) saturate(120%)';cover(ctx,-60,-60,W+120,H+120,{x:50,y:45,z:100});ctx.restore();ctx.filter='none'}
    ctx.fillStyle='rgba(8,12,28,.5)';ctx.fillRect(0,0,W,H);
    const s=W*.70,o0=(W-s)/2,r=s*.035;ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=46;ctx.shadowOffsetY=10;rr(ctx,o0,o0,s,s,r);ctx.fillStyle='#000';ctx.fill();ctx.restore();
    ctx.save();rr(ctx,o0,o0,s,s,r);ctx.clip();ctx.drawImage(off,o0,o0,s,s);ctx.restore();
  }else renderModelo(ctx,W,H,cv);
  document.getElementById('topinfo').textContent=MESES[S.mes][0].toUpperCase()+MESES[S.mes].slice(1)+' de '+S.ano;
}catch(e){toast('Erro ao desenhar: '+e.message,true)}})}

function fit(){const st=document.querySelector('.stage'),cs=getComputedStyle(st);const aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const k=Math.min(aw/cv.width,ah/cv.height);cv.style.width=Math.max(50,Math.floor(cv.width*k))+'px';cv.style.height=Math.max(50,Math.floor(cv.height*k))+'px'}
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(document.querySelector('.stage'));

  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob){toast('Não foi possível gerar a imagem.',true);return}
  const nome=`escala-danca-${MESES[S.mes].normalize('NFD').replace(/[̀-ͯ]/g,'')}-${S.ano}${S.formato==='whats'?'-grupo-whatsapp':''}.png`;
  if(window.claude&&typeof window.claude.use==='function'){try{const dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:nome,data:blob});toast('Imagem salva');return}}
    catch(err){if(err&&err.code==='declined'){toast('Download cancelado');return}if(err&&err.code==='rate_limited'){toast('Aguarde um instante e tente de novo.');return}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)});

/* ---------- início ---------- */
showTab('escala');draw();
const fontes=['400 40px "Bebas Neue"','400 40px Oswald','500 40px Oswald','600 40px Oswald','700 40px Oswald','400 40px Inter','300 40px Inter','600 40px Inter','700 40px Inter','italic 400 40px Lora','italic 600 40px Lora','400 40px "Permanent Marker"'];
if(document.fonts){Promise.all(fontes.map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>draw());document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>draw())}
</script>
